name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token can read the repository and nothing else. A job that needs more
# asks for it by name.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Each push to main
# is its own group, so every commit there is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tools are pinned to an exact version (ADR-0003).
  GO_VERSION: "1.27.1"
  # honnef.co/go/tools 2026.2.1. The go command verifies it against the Go
  # checksum database.
  STATICCHECK_VERSION: v0.8.1
  FUZZ_TIME: 10s
  RELEASE_TARGETS: windows/amd64 darwin/amd64 darwin/arm64 linux/amd64

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: go run "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION" ./...

      - name: Build every release target
        run: |
          for target in $RELEASE_TARGETS; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./...
          done

      # The binaries are built with coverage instrumentation, so that running
      # them covers what no test can call: each main function.
      - name: Test with the race detector
        run: |
          mkdir -p coverage/e2e
          go build -cover -covermode=atomic -o bin/ ./cmd/rich-presence ./tools/covercheck ./tools/mcpb ./tools/policycheck
          measured=$(go list ./... | GOCOVERDIR=coverage/e2e bin/covercheck packages)
          CGO_ENABLED=1 go test -race -coverpkg="$measured" -coverprofile=coverage/unit.txt ./...

      # Fuzz targets are discovered, so a new one is picked up without a
      # change here.
      - name: Fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "fuzzing $target in $pkg"
              go test -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZ_TIME" "$pkg"
            done
          done

      # End-to-end runs of the instrumented binaries. CRP-043 adds the real
      # scenarios here.
      - name: End-to-end coverage
        run: |
          # Every command of the product, with the exit code it must give. The
          # runtime directory is the job's own, so that nothing here can meet
          # a host that is running on the machine.
          export GOCOVERDIR=coverage/e2e
          export RICH_PRESENCE_RUNTIME_DIR="$RUNNER_TEMP/rich-presence-e2e"
          expect_exit() { want=$1; shift; code=0; "$@" || code=$?; if [ "$code" -ne "$want" ]; then echo "$*: exit $code, want $want"; return 1; fi; }
          expect_exit 0 bin/rich-presence version
          expect_exit 0 bin/rich-presence help
          expect_exit 2 bin/rich-presence frobnicate
          expect_exit 3 bin/rich-presence status
          # The bundle tool refuses to run without a command.
          expect_exit 2 bin/mcpb
          # No Discord is running here, so the doctor reports a problem.
          expect_exit 1 bin/rich-presence doctor
          # The server answers initialize and lists its tools, and ends with
          # its input.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"claude-code","version":"2.0.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' |
            expect_exit 0 bin/rich-presence mcp > coverage/mcp-out.txt
          grep -q presence_status coverage/mcp-out.txt
          unset RICH_PRESENCE_RUNTIME_DIR
          # The dependency policy of ADR-0003. Running the real checks on the
          # real files is also what covers the main function of policycheck.
          # Windows is listed too: go-winio is linked there and nowhere else.
          for target in $RELEASE_TARGETS; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go list -deps -test -json ./... |
              GOCOVERDIR=coverage/e2e bin/policycheck modules .github/allowed-modules.txt
          done
          GOCOVERDIR=coverage/e2e bin/policycheck actions .github/workflows/*.yml
          go tool covdata textfmt -i=coverage/e2e -o coverage/e2e.txt
          { cat coverage/unit.txt; tail -n +2 coverage/e2e.txt; } > coverage/profile.txt

      - name: Upload the coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/profile.txt
          if-no-files-found: error

      - name: Coverage gate
        run: go run ./tools/covercheck check -module "$(go list -m)" coverage/profile.txt

  # The bundle of ADR-0007. Its Mac binary is universal, merged from the two
  # architecture builds with lipo, which exists only on a Mac. The version
  # has one source, the VERSION file: it goes into the manifest and, through
  # the linker, into every binary.
  bundle-darwin:
    name: Bundle (universal Mac binary)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Build, merge and sign
        run: |
          version=$(cat VERSION)
          ldflags="-s -w -buildid= -X $(go list -m)/internal/cli.version=$version"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "dist/rich-presence-$arch" ./cmd/rich-presence
          done
          lipo -create -output dist/rich-presence-darwin dist/rich-presence-amd64 dist/rich-presence-arm64
          chmod +x dist/rich-presence-darwin
          # Say whether merging kept the slices' ad hoc signatures, then sign
          # the merged file again either way. The refusal to run an unsigned
          # binary on Apple silicon is why the signature matters.
          if codesign --verify dist/rich-presence-darwin; then echo "merge kept the signatures"; else echo "merge invalidated the signatures"; fi
          codesign --force --sign - dist/rich-presence-darwin
          codesign --verify --verbose=2 dist/rich-presence-darwin
          archs=$(lipo -archs dist/rich-presence-darwin)
          echo "architectures: $archs"
          case "$archs" in *x86_64*arm64* | *arm64*x86_64*) ;; *) echo "not universal"; exit 1 ;; esac
          # The architecture this runner has runs it. The other is checked by
          # the archs line above and again by mcpb check.
          test "$(dist/rich-presence-darwin version)" = "rich-presence $version"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-darwin
          path: dist/rich-presence-darwin
          if-no-files-found: error

  bundle:
    name: Bundle
    needs: bundle-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-darwin
          path: dist/darwin

      - name: Assemble and check
        run: |
          version=$(cat VERSION)
          ldflags="-s -w -buildid= -X $(go list -m)/internal/cli.version=$version"
          go build -o bin/mcpb ./tools/mcpb
          assemble() {
            out=$1
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "$out/rich-presence.exe" ./cmd/rich-presence
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o "$out/rich-presence-linux" ./cmd/rich-presence
            bin/mcpb build -version "$version" -out "$out/rich-presence.mcpb"             \
              -manifest extension/manifest.json -icon extension/icon.png             \
              -license LICENSE.md -notices extension/THIRD-PARTY-NOTICES.md             \
              -windows "$out/rich-presence.exe" -darwin dist/darwin/rich-presence-darwin -linux "$out/rich-presence-linux"
          }
          mkdir -p dist/a dist/b
          assemble dist/a
          bin/mcpb check -version "$version" dist/a/rich-presence.mcpb
          # The binaries report the version the manifest carries.
          chmod +x dist/a/rich-presence-linux
          test "$(dist/a/rich-presence-linux version)" = "rich-presence $version"
          # Extracting keeps the executable bit on the Unix binaries.
          mkdir dist/extracted
          unzip -q dist/a/rich-presence.mcpb -d dist/extracted
          unzip -Z dist/a/rich-presence.mcpb | grep -E 'server/rich-presence-(darwin|linux)' | grep -q -- '-rwxr-xr-x'
          # A second build from the same commit is byte-identical.
          assemble dist/b
          cmp dist/a/rich-presence.mcpb dist/b/rich-presence.mcpb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: dist/a/rich-presence.mcpb
          if-no-files-found: error

  # One check that stands for the whole matrix, so that branch protection has
  # a single name to require.
  ci:
    name: CI
    if: always()
    needs: [check, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every operating system passed, and the bundle was built
        env:
          RESULT: ${{ needs.check.result }}
          BUNDLE: ${{ needs.bundle.result }}
        run: test "$RESULT" = success && test "$BUNDLE" = success
